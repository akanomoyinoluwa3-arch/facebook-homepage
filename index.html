<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceook</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }

        body {
            background-color: #f0f2f5;
            color: #050505;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            padding-bottom: 60px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #ffffff;
        }

        .header.logo {
            color: #1877f2;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e4e6eb;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-weight: bold;
        }
        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: #e41e3f;
            color: #ffffff;
            border-radius: 10px;
            padding: 2px 5px;
            font-size: 11px;
            font-weight: bold;
        }

        .create-post {
            display: flex;
            align-items: center;
            padding: 8px 16px 12px;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #333;
        }

        .post-input {
            flex-grow: 1;
            border: 1px solid #ced0d4;
            border-radius: 20px;
            padding: 10px 16px;
        }

        .photo-icon {
            color: #45bd62;
            font-size: 20px;
        }

        .stories-container {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            overflow-x: auto;
            border-bottom: 8px solid #f0f2f5;
        }

        .story-card {
            min-width: 100px;
            height: 160px;
            border-radius: 10px;
            background-color: #e4e6eb;
            position: relative;
        }

        .story-card.dark {
            background-color: #000;
        }

        .post {
            padding: 12px 16px;
            border-bottom: 8px solid #f0f2f5;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .post-user-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .post-user-info .avatar {
            background-color: #eab308;
        }

        .user-name {
            font-weight: 600;
            font-size: 15px;
        }

        .post-meta {
            font-size: 12px;
            color: #65676b;
        }

        .post-content {
            margin-top: 12px;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.3;
        }

        .post-content a {
            color: #1877f2;
            text-decoration: none;
        }

        .post-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-bottom: 8px;
            color: #65676b;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background-color: #fff;
            border-top: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            color: #65676b;
            font-size: 20px;
        }

        .nav-item.active {
            color: #1877f2;
        }

        .nav-badge {
            position: absolute;
            top: -4px;
            right: -6px;
            background-color: #e41e3f;
            color: #fff;
            font-size: 10px;
            border-radius: 8px;
            padding: 1px 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">Faceook</div>
            <div class="header-icons">
                <div class="icon-circle">+</div>
                <div class="icon-circle">🔎</div>
                <div class="icon-circle">
                    💬
                    <span class="badge">7</span>
                </div>
            </div>

        </header>

        <div class="create-post">
            <div class="avatar"></div>
            <div class="post-input">What's on my mind</div>
            <div class="photo-icon">🖼</div>
        </div>

        <div class="stories-container">
            <div class="story-card dark"></div>
            <div class="story-card"></div>
            <div class="story-card"></div>
            <div class="story-card"></div>
        </div>

        <article class="post">
            <div class="post-header">
                <div class="post-user-info">
                    <div class="avatar"></div>
                    <div>
                        <div class="user-name">Victor Oluwadarasimi</div>
                        <div class="post-meta">2d. 👨‍💼</div>
                    </div>
                </div>

                <div>... &nbsp; X</div>
            </div>

            <div class="post-content">
                With <a href="#">SeyizySho Tv</a>- I just got recognized as one of their top fans!
            </div>

            <div class="post-stats">
                <div>👍 4 &nbsp; 💬</div>
            </div>
        </article>

        <div class="bottom-nav">
            <div class="nav-item active">🏠</div>
            <div class="nav-item">📺</div>
            <div class="nav-item">
                👯‍♀️
                <span class="nav-badge">2</span>
            </div>
            <div class="nav-item">🏘</div>
            <div class="nav-item">
                🔔
                <span class="nav-badge">9+</span>
            </div>
            <div class="nav-item">👨</div>
        </div>
    </div>
</body>
</html>
